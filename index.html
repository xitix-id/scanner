<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>xiTix Scanner</title>

    <script
        src="https://unpkg.com/html5-qrcode"
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #111;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        header {
            width: 100%;
            padding: 18px;

            text-align: center;

            font-size: 22px;
            font-weight: bold;

            background: #181818;
        }


        #scanner {
            width: 100%;
            max-width: 500px;

            padding: 15px;
        }


        #reader {
            width: 100%;
        }


        #result {

            width: calc(100% - 30px);

            max-width: 500px;

            margin: 10px 15px 30px;

            padding: 30px 20px;

            border-radius: 18px;

            text-align: center;

            background: #222;

            transition: 0.2s;
        }


        #result .icon {

            font-size: 55px;

            margin-bottom: 10px;
        }


        #result .title {

            font-size: 28px;

            font-weight: bold;
        }


        #result .code {

            margin-top: 12px;

            font-size: 22px;

            letter-spacing: 3px;
        }


        #result .message {

            margin-top: 10px;

            font-size: 16px;

            opacity: 0.9;
        }


        .waiting {
            background: #222 !important;
        }


        .valid {
            background: #087f3e !important;
        }


        .used {
            background: #a71919 !important;
        }


        .invalid {
            background: #a71919 !important;
        }


        .error {
            background: #7a4b00 !important;
        }


        .footer {

            margin-top: auto;

            padding: 15px;

            font-size: 12px;

            opacity: 0.5;
        }

    </style>

</head>


<body>


<header>
    🎟️ xiTix TICKET SCANNER
</header>


<div id="scanner">

    <div id="reader"></div>

</div>


<div
    id="result"
    class="waiting"
>

    <div class="icon">
        📷
    </div>

    <div class="title">
        SIAP SCAN
    </div>

    <div class="message">
        Arahkan kamera ke QR tiket
    </div>

</div>


<div class="footer">
    Gate Scanner
</div>


<script>


/*
==========================================
GANTI DENGAN URL GOOGLE APPS SCRIPT LU
==========================================
*/

const API_URL =
    "PASTE_URL_APPS_SCRIPT_LU_DI_SINI";


let scanning = true;


/*
==========================================
TAMPILKAN HASIL
==========================================
*/

function showResult(
    type,
    icon,
    title,
    code,
    message
) {

    const result =
        document.getElementById("result");


    result.className = type;


    result.innerHTML = `

        <div class="icon">
            ${icon}
        </div>

        <div class="title">
            ${title}
        </div>

        <div class="code">
            ${code || ""}
        </div>

        <div class="message">
            ${message || ""}
        </div>

    `;

}


/*
==========================================
BUNYI
==========================================
*/

function beep(
    frequency,
    duration
) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audio =
            new AudioContext();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.frequency.value =
            frequency;


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        gain.gain.setValueAtTime(
            0.3,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime +
            duration / 1000
        );


        oscillator.stop(
            audio.currentTime +
            duration / 1000
        );

    }

    catch (error) {

        console.log(error);

    }

}


/*
==========================================
KIRIM KODE KE GOOGLE APPS SCRIPT
==========================================
*/

async function scanTicket(code) {


    scanning = false;


    showResult(
        "waiting",
        "⏳",
        "MEMERIKSA",
        code,
        "Mohon tunggu..."
    );


    try {


        const url =
            API_URL +
            "?code=" +
            encodeURIComponent(code);


        const response =
            await fetch(url);


        const data =
            await response.json();


        /*
        ==============================
        VALID
        ==============================
        */

        if (
            data.result ===
            "VALID"
        ) {

            showResult(
                "valid",
                "✓",
                "TIKET VALID",
                data.code,
                "SILAKAN MASUK"
            );


            beep(
                900,
                250
            );

        }


        /*
        ==============================
        SUDAH DIGUNAKAN
        ==============================
        */

        else if (
            data.result ===
            "USED"
        ) {

            showResult(
                "used",
                "✕",
                "SUDAH DIGUNAKAN",
                data.code,
                "TIKET TIDAK DAPAT DIGUNAKAN LAGI"
            );


            beep(
                180,
                600
            );

        }


        /*
        ==============================
        TIDAK DITEMUKAN
        ==============================
        */

        else if (
            data.result ===
            "NOT_FOUND"
        ) {

            showResult(
                "invalid",
                "✕",
                "TIKET TIDAK VALID",
                data.code,
                "KODE TIDAK TERDAFTAR"
            );


            beep(
                180,
                600
            );

        }


        /*
        ==============================
        FORMAT SALAH
        ==============================
        */

        else if (
            data.result ===
            "INVALID_FORMAT"
        ) {

            showResult(
                "invalid",
                "⚠️",
                "FORMAT SALAH",
                data.code || "",
                "Kode tiket harus 6 karakter"
            );


            beep(
                180,
                500
            );

        }


        /*
        ==============================
        ERROR
        ==============================
        */

        else {

            showResult(
                "error",
                "⚠️",
                "ERROR",
                "",
                data.message ||
                "Terjadi kesalahan"
            );

        }

    }


    catch (error) {


        console.error(error);


        showResult(
            "error",
            "⚠️",
            "KONEKSI GAGAL",
            "",
            "Tidak dapat menghubungi server"
        );


    }


    /*
    ======================================
    AKTIFKAN SCAN LAGI
    ======================================
    */

    setTimeout(
        resetScanner,
        2500
    );

}


/*
==========================================
RESET
==========================================
*/

function resetScanner() {

    scanning = true;


    showResult(
        "waiting",
        "📷",
        "SIAP SCAN",
        "",
        "Arahkan kamera ke QR tiket"
    );

}


/*
==========================================
KETIKA QR BERHASIL DIBACA
==========================================
*/

function onScanSuccess(
    decodedText
) {


    if (!scanning) {
        return;
    }


    /*
    QR LU HARUS BERISI
    6 KARAKTER SAJA
    */

    const code =
        decodedText
            .trim()
            .toUpperCase();


    scanTicket(code);

}


/*
==========================================
INISIALISASI SCANNER
==========================================
*/

const scanner =
    new Html5QrcodeScanner(
        "reader",
        {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            },

            rememberLastUsedCamera: true,

            showTorchButtonIfSupported: true,

            showZoomSliderIfSupported: true

        },

        false
    );


scanner.render(
    onScanSuccess,
    function(errorMessage) {

        // Error scanning normal,
        // tidak perlu ditampilkan.

    }
);


</script>


</body>

</html>
